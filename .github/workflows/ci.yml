name: CI

# Проверка каждой ветки и каждого PR. Ничего не деплоит и не трогает боевые
# ресурсы: миграции применяет только `build:deploy`, назначенный buildCommand
# в vercel.json, а он здесь не вызывается.
#
# Ветка, живущая в самом репозитории, уже покрыта событием `push`, поэтому её
# PR давал второй прогон того же коммита — вдвое больше минут и два одинаковых
# набора статусов. Условие на каждой job оставляет `pull_request` только для
# форков: их веток здесь нет, и push-событие для них не приходит. Статус всё
# равно виден в PR, потому что проверки привязаны к коммиту, а не к событию.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Свои ветки проверяет `push`; здесь остаются только PR из форков.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    # Заведомо нерабочие значения. Нужны, потому что `prisma generate` читает
    # datasource из схемы, а Next при сборке подставляет NEXT_PUBLIC_* в бандл.
    # Реальные секреты сюда не попадают намеренно: сборка в БД не ходит, и
    # подключение по этому адресу в раннере невозможно.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXT_PUBLIC_PUSHER_KEY: ci-placeholder
      NEXT_PUBLIC_PUSHER_CLUSTER: ap1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall выполняет `prisma generate` — без него не соберутся типы.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Идёт последним: дольше всех и повторно проверяет типы вместе с
      # сгенерированными типами маршрутов, которых нет на шаге typecheck.
      - name: Build
        run: npm run build

  # Интеграционные тесты Server Actions против настоящего PostgreSQL. Отдельной
  # job — чтобы лёгкие проверки выше не ждали поднятия базы и было видно, что
  # именно упало. Здесь применяется `prisma migrate deploy`, но только к
  # эфемерной базе service-контейнера, а не к боевой.
  integration:
    runs-on: ubuntu-latest
    # Дедупликация прогонов — см. комментарий к триггерам вверху файла.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartlists_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartlists_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Имя базы содержит "test" — проходит защиту global-setup от прогона
      # против не-тестовой базы.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/smartlists_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/smartlists_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # E2E: настоящий браузер против собранного приложения и отдельной базы.
  # Своя job, потому что дольше остальных и требует загрузки Chromium. База —
  # тоже эфемерный service-контейнер; боевые ресурсы не затрагиваются.
  e2e:
    runs-on: ubuntu-latest
    # Дедупликация прогонов — см. комментарий к триггерам вверху файла.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartlists_e2e_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartlists_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Остальное окружение приложения задаёт playwright.config.ts (test/e2e/env.ts):
      # он же поднимает сборку и сервер. Имя базы содержит "test" — проходит
      # защиту global-setup от прогона против не-тестовой базы.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/smartlists_e2e_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Только Chromium: остальные браузеры проект не поддерживает отдельно,
      # а каждый добавляет минуты к прогону.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # Отчёт со скриншотами, видео и трассировками — единственный способ
      # разобрать падение, которое не воспроизводится локально.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Секреты в истории. Дублирует push protection GitHub, но с другой стороны:
  # тот знает шаблоны известных провайдеров, а gitleaks ловит и generic-строки
  # вроде приватных ключей и строк подключения. Репозиторий публичный, поэтому
  # проверка нужна и на PR со стороны.
  secrets:
    runs-on: ubuntu-latest
    # Дедупликация прогонов — см. комментарий к триггерам вверху файла.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история, а не последний коммит: секрет, добавленный и удалённый
          # внутри одного PR, остаётся в промежуточных коммитах.
          fetch-depth: 0

      # Бинарь официального релиза вместо стороннего action: в job попадает
      # только то, что мы явно назвали версией.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # --redact: найденное значение не печатается в лог, который публичен.
      - name: Scan history
        run: gitleaks git --redact --verbose .
