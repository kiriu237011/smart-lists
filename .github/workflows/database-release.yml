name: Database Release

# Вызывается только из CI того же проверяемого SHA. Самостоятельного push- или
# PR-триггера нет: production credential не должен появляться у веточного кода.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  migrate:
    name: Production migration
    runs-on: ubuntu-latest
    environment: production

    # Два main-прогона не применяют миграции одновременно. Уже начатую
    # миграцию нельзя отменять новым push: не каждая будущая DDL будет
    # транзакционной.
    concurrency:
      group: production-database-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      # postinstall запускает prisma generate и требует синтаксически валидный
      # URL, но к БД не подключается. Реальный секрет этому шагу не выдаётся.
      - name: Install dependencies
        env:
          DIRECT_URL: postgresql://release:release@127.0.0.1:5432/placeholder
        run: npm ci

      - name: Verify database target
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
        run: node scripts/verify-release-database.mjs

      - name: Apply production migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate:deploy
