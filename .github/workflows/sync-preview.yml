name: Sync Preview Proxy

# Постоянная ветка preview служит OAuth redirect proxy для всех Vercel Preview
# deployments. Обновлять её после каждого изменения приложения не нужно:
# синхронизация выполняется только когда с последнего merge менялся код самого
# proxy, его runtime-зависимости или конфигурация сборки.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

# Два успешных CI подряд не должны одновременно создавать merge-коммиты.
concurrency:
  group: sync-preview-proxy
  cancel-in-progress: false

# Это единственный обычный workflow с правом записи в репозиторий. Реальные
# секреты ему не передаются; встроенный GITHUB_TOKEN нужен только для preview.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: preview
    # workflow_run выдаёт write-token и после PR-прогона, поэтому одного фильтра
    # branches недостаточно: принимаем только успешный push именно в main.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      # Полная история нужна для merge-base и merge с инфраструктурной веткой.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview
          fetch-depth: 0

      - name: Merge tested auth changes into preview
        id: merge
        shell: bash
        env:
          # Автоматический запуск синхронизирует ровно тот main-коммит, для
          # которого закончился CI, а не более свежий ещё непроверенный HEAD.
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "${GITHUB_OUTPUT}"

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/preview:refs/remotes/origin/preview

          if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
            echo "::error::Проверенный коммит больше не принадлежит main"
            exit 1
          fi

          if git merge-base --is-ancestor "${TARGET_SHA}" origin/preview; then
            echo "preview уже содержит ${TARGET_SHA}"
            exit 0
          fi

          proxy_paths=(
            .github/workflows/sync-preview.yml
            package.json
            package-lock.json
            next.config.ts
            vercel.json
            prisma.config.ts
            prisma/schema.prisma
            prisma/migrations
            src/auth.ts
            src/app/api/auth
            src/app/auth-error
            src/generated/prisma
            src/i18n
            src/lib/allowed-email.ts
            src/lib/auth-errors.ts
            src/lib/db.ts
            src/lib/logger.ts
            src/lib/prisma-client.ts
            src/lib/spaces.ts
            src/proxy.ts
            scripts/verify-release-database.mjs
          )

          if git diff --quiet "origin/preview...${TARGET_SHA}" -- "${proxy_paths[@]}"; then
            echo "OAuth proxy и его зависимости не менялись; синхронизация не нужна"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "${TARGET_SHA}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      # Пока ENABLE_PREVIEW_MIGRATION не включена, Preview продолжает старый
      # build:deploy. После cutover миграция выполняется здесь до git push,
      # поэтому Vercel не может начать сборку раньше схемы.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.merge.outputs.changed == 'true' && vars.ENABLE_PREVIEW_MIGRATION == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies for Preview migration
        if: steps.merge.outputs.changed == 'true' && vars.ENABLE_PREVIEW_MIGRATION == 'true'
        env:
          DIRECT_URL: postgresql://release:release@127.0.0.1:5432/placeholder
        run: npm ci

      - name: Verify Preview database target
        if: steps.merge.outputs.changed == 'true' && vars.ENABLE_PREVIEW_MIGRATION == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED_DATABASE_HOST: ${{ secrets.EXPECTED_DATABASE_HOST }}
        run: node scripts/verify-release-database.mjs

      - name: Apply Preview migrations
        if: steps.merge.outputs.changed == 'true' && vars.ENABLE_PREVIEW_MIGRATION == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate:deploy

      - name: Push tested Preview proxy
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:preview
