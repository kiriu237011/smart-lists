name: Cleanup Pending Attachments

# Уборка зависших PENDING-вложений: чистит мусор и освобождает квоту.
# Дёргает защищённый эндпоинт приложения, который делает deleteMany по
# PENDING-строкам старше ~15 минут (см. src/app/api/cron/cleanup-attachments).

on:
  schedule:
    - cron: '*/15 * * * *'  # каждые 15 минут
  workflow_dispatch:         # возможность запустить вручную

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Call cleanup endpoint
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.ATTACHMENTS_CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/cleanup-attachments"
